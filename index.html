<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6F0E4">
  <meta name="description" content="Make a pet. Build its day. Tell its story. A cosy, offline English learning game.">
  <title>Create Your Pet · A little friend, a big story</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/catalog.js"></script>
  <script defer src="js/art.generated.js"></script>
  <script defer src="js/grammar.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/compare.js"></script>
  <script defer src="js/scene.js"></script>
  <script defer src="js/export.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-frame" id="app-root">
    <header class="topbar">
      <a class="brand" href="#" id="brand-home" aria-label="Create Your Pet home"><span class="brand-mark" aria-hidden="true">p.</span><span>create your pet<span class="brand-sub">A LITTLE FRIEND. A BIG STORY.</span></span></a>
      <div class="header-actions"><button class="text-button" id="save-session">Save session</button><button class="text-button" id="fullscreen">Full screen</button><button class="text-button" id="restart">Start again</button></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="app-footer"><span>Made for little imaginations & big conversations.</span><span id="save-state">Your game stays on this device.</span></footer>
  </div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="import-session" accept="application/json,.json" hidden>
  <dialog id="confirm-dialog"><form method="dialog"><span class="eyebrow">JUST A MOMENT</span><h2 id="dialog-title">Start again?</h2><p id="dialog-description"></p><div class="dialog-actions"><button value="cancel" class="secondary" id="dialog-cancel">Keep playing</button><button value="confirm" class="primary" id="dialog-confirm">Start again</button></div></form></dialog>
  <noscript><p class="notice">Please turn on JavaScript to create your pet. This game works offline.</p></noscript>
</body>
</html>
